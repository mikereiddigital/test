name: Destroy Test

on:
  pull_request:

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    DESTROY_THRESHOLD: 8
    PLAN_FILE: plan_output_12.txt

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Get Plan Output
        id: get_plan_output
        env:
            DESTROY_THRESHOLD: ${{ env.DESTROY_THRESHOLD }}
            PLAN_FILE: ${{ env.PLAN_FILE }}
        run: |
            file_content="$(cat files/$PLAN_FILE)"
            destroy_count=$(echo "$file_content" | grep -oE 'Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy' | awk '{print $8}')
            if [ "$destroy_count" -gt $DESTROY_THRESHOLD ]; then
                echo "Warning: There are $destroy_count resources to be destroyed in this plan."
            else
                echo "Destroy Threshold not exceeded"
            fi
            echo "destroy_count=$destroy_count" >> $GITHUB_ENV

      - name: Get Confirmation
        uses: actions/github-script@v7.0.1
        env:
            DESTROY_COUNT: ${{ env.DESTROY_COUNT }}
            DESTROY_THRESHOLD: ${{ env.DESTROY_THRESHOLD }}
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: |
                const owner = "mikereiddigital-org";
                const repo = test;
                await github.rest.issues.createComment({
                    owner: owner,
                    repo: repo,
                    issue_number: context.payload.pull_request.number,
                    body: `@${{ github.actor }} \n
                    Terraform plan evaluation detected the number of resources to be destroyed is ${{ env.DESTROY_COUNT }} \n
                    Please confirm if you want to proceed with the apply operation.`
                });

                const {data: reviews} = await github.rest.pulls.listReviews({
                pull_number: context.payload.pull_request.number
                });

                const {data: team_members} = await github.rest.teams.listMembersInOrg({
                    org: orgName,
                    team_slug: teamSlug
                });

                const teamMemberLogins = team_members.map(member => member.login);
                const approved = reviews.some(review => review.state === 'APPROVED' && teamMemberLogins.includes(review.user.login));

                if (approved) {
                    core.notice('Pull request approved by team');
                } 
                else {
                    core.setFailed('Terraform plan evaluation detected changes to resources that require approval from a member of team');
                    await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.pull_request.number,
                    event: 'REQUEST_CHANGES',
                    body: 'Terraform plan evaluation detected changes to resources that require approval from owner - please contact owner for assistance'
                    });
                }