name: Destroy Test

on:
  push:
    branches:
      - test3

permissions:
  contents: write
  actions: write

env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Get Plan Output
        id: get_plan_output
        run: |
            file_content="$(cat files/plan_output.txt)"
            destroy_count=$(echo "$file_content" | grep -oE 'Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy' | awk '{print $8}')
            if [ "$destroy_count" -gt 0 ]; then
                echo "Warning: There are $destroy_count resources to be destroyed in this plan."
            else
                echo "No resources to be destroyed"
            fi
            echo "::set-output name=destroy_count::$destroy_count"

      - name: Get Confirmation
        if: ${{ steps.get_plan_output.outputs.destroy_count != '' }}
        id: get_confirmation
        uses: actions/github-script@v7.0.1
        env:
            DESTROY_COUNT: ${{ steps.get_plan_output.outputs.destroy_count }}
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: |
                const owner = context.repo.owner;
                const repo = context.repo.repo;
                await github.rest.issues.createComment({
                    owner: owner,
                    repo: repo,
                    issue_number: context.payload.pull_request.number,
                    body: `@${context.actor} Terraform plan evaluation detected changes to resources that require approval \n
                    Guidance on approving these PRs is available at https://user-guide.modernisation-platform.service.justice.gov.uk/runbooks/reviewing-mp-environments-prs.html#process-for-approving-prs`
                });