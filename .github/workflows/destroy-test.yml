name: Destroy Test

on:
  pull_request:

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    DESTROY_THRESHOLD: 2
    PLAN_FILE: plan_output.txt

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Get Plan Output
        id: get_plan_output
        env:
            DESTROY_THRESHOLD: ${{ env.DESTROY_THRESHOLD }}
            PLAN_FILE: ${{ env.PLAN_FILE }}
        run: |
            file_content="$(cat files/$PLAN_FILE)"
            destroy_count=$(echo "$file_content" | grep -oE 'Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy' | awk '{print $8}')
            if [ "$destroy_count" -gt $DESTROY_THRESHOLD ]; then
                echo "Warning: There are $destroy_count resources to be destroyed in this plan."
            else
                echo "No resources to be destroyed"
            fi
            echo "destroy_count=$destroy_count" >> $GITHUB_ENV

      - name: Get Confirmation
        id: get_confirmation
        uses: actions/github-script@v7.0.1
        env:
          DESTROY_COUNT: ${{ env.destroy_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: issue_number,
              body: `@${{ github.actor }} \n
              Terraform plan evaluation detected the number of resources to be destroyed is ${{ env.DESTROY_COUNT }} \n
              Please confirm if you want to proceed with the apply operation.`
            });

            # const {data: reviews} = await github.rest.pulls.listReviews({
            #   owner: owner,
            #   repo: repo,
            #   pull_number: issue_number
            # });

            # const {data: team_members} = await github.rest.teams.listMembersInOrg({
            #   org: context.repo.owner,
            #   team_slug: 'Admin'
            # });

