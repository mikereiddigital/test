name: Destroy Test

on:
  pull_request:

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    DESTROY_THRESHOLD: 2
    PLAN_FILE: plan_output.txt

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Get Plan Output
        id: get_plan_output
        env:
            DESTROY_THRESHOLD: ${{ env.DESTROY_THRESHOLD }}
            PLAN_FILE: ${{ env.PLAN_FILE }}
        run: |
            plan_content="$(cat files/$PLAN_FILE)"
            destroy_count=$(echo "$plan_content" | grep -oE 'Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy' | awk '{print $8}')
            if ! [[ "$destroy_count" =~ ^[0-9]+$ ]]; then
                echo "Invalid destroy_count value: $destroy_count"
                exit 1
            fi
            if ! [[ "$DESTROY_THRESHOLD" =~ ^[0-9]+$ ]]; then
                echo "Invalid DESTROY_THRESHOLD value: $DESTROY_THRESHOLD"
                exit 1
            fi
            if [ "$destroy_count" -gt "$DESTROY_THRESHOLD" ]; then
                echo "Warning: There are $destroy_count resources to be destroyed in this plan."
            elif [ "$destroy_count" -gt 0 ]; then
                echo "There are $destroy_count resources to be destroyed, which is below the threshold."
            else
                echo "No resources to be destroyed"
            fi
            echo "destroy_count=$destroy_count" >> $GITHUB_ENV


      - name: Get Confirmation
        uses: actions/github-script@v7.0.1
        env:
            DESTROY_COUNT: ${{ ENV.DESTROY_COUNT }}
            DESTROY_THRESHOLD: ${{ env.DESTROY_THRESHOLD }}
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: |
                const owner = context.repo.owner;
                const repo = context.repo.repo;
                const destroyCount = parseInt(process.env.DESTROY_COUNT, 10);
                const destroyThreshold = parseInt(process.env.DESTROY_THRESHOLD, 10);
                if (destroyCount > destroyThreshold) {
                    await github.rest.issues.createComment({
                        owner: owner,
                        repo: repo,
                        issue_number: context.payload.pull_request.number,
                        body: `@${{ github.actor }} \n
                        Terraform plan evaluation detected the number of resources to be destroyed is ${destroyCount} \n
                        Please confirm if you want to proceed with the apply operation.`
                    });
                }